    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '`'
    - +
    - '-'
    - '='
  - ['!', '@', '#', ':', LSHFT, CAPSLOCK, LCTRL, LSHFT, SPACE, RET]
